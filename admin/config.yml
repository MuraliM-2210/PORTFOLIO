backend:
  name: turbo-github
  turbo_site_id: YOUR_DECAP_TURBO_SITE_ID
  branch: main

publish_mode: simple
site_url: https://muralim-2210.github.io/PORTFOLIO
display_url: https://muralim-2210.github.io/PORTFOLIO

media_folder: assets/blogs
public_folder: /PORTFOLIO/assets/blogs

collections:
  - name: journal
    label: Blog
    files:
      - name: published_posts
        label: Published posts
        file: blogs.json
        fields:
          - label: Articles
            name: posts
            widget: list
            collapsed: true
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - label: URL slug
                name: slug
                widget: string
                hint: Use a short unique URL name, for example pulalli-mountain-village.
              - label: Blog title
                name: title
                widget: string
              - label: Category
                name: category
                widget: select
                options:
                  - Photography
                  - Media
                  - Culture
                  - Personal
                  - Research
                  - Travel
                  - Opinion
              - label: Publish date
                name: date
                widget: datetime
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
              - label: Short introduction
                name: excerpt
                widget: text
              - label: Featured cover image
                name: cover
                widget: image
                required: false
              - label: Article
                name: content
                widget: markdown
                buttons:
                  - bold
                  - italic
                  - heading-two
                  - heading-three
                  - quote
                  - bulleted-list
                  - numbered-list
                  - link
                  - image
