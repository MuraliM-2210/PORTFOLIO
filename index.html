<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090817">
<meta name="description" content="Murali M — DOP & Video Producer. Explore the portfolio.">
<title>Murali M | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#080816}
body{font-family:"DM Sans",sans-serif;overflow:hidden}
.landing{
  position:relative;isolation:isolate;
  width:100%;min-height:100vh;min-height:100svh;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 22px clamp(34px,6.5vh,68px);
  background-color:#080816;
  background-image:linear-gradient(180deg,rgba(5,7,20,.10) 0%,rgba(5,7,20,.16) 58%,rgba(5,7,20,.76) 100%),radial-gradient(ellipse at 4% 18%,rgba(240,75,223,.23),transparent 58%),radial-gradient(ellipse at 96% 18%,rgba(40,197,255,.24),transparent 58%),url("assets/images/portfolio-hero.avif");
  background-repeat:no-repeat;background-size:cover,58% 82%,58% 82%,contain;background-position:center,left center,right center,center center;
}
.landing:before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(4,8,24,.28),transparent 55%),linear-gradient(90deg,rgba(240,75,223,.045),transparent 42%,rgba(40,197,255,.045));
}
.landing-content{
  position:relative;z-index:1;width:min(760px,100%);margin:0 auto 1.8vh;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px;
  padding:28px 24px 23px;border:1px solid rgba(224,226,255,.18);border-radius:26px;
  background:linear-gradient(125deg,rgba(9,12,35,.76),rgba(12,20,45,.64));
  box-shadow:0 22px 70px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.landing-kicker{color:#c6c9ed;font-size:.62rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase;}
.landing-name{
  margin:0;color:#fff;font-size:clamp(2.7rem,7vw,5.7rem);font-weight:800;
  letter-spacing:-.065em;line-height:.98;text-shadow:0 4px 25px rgba(0,0,0,.32);
}
.landing-role{
  margin:0;color:#f4f2ff;font-size:clamp(.9rem,2vw,1.18rem);font-weight:800;
  letter-spacing:.17em;text-transform:uppercase;text-shadow:0 2px 16px rgba(0,0,0,.45);
}
.landing-role::before{
  content:"";display:block;width:76px;height:3px;margin:0 auto 13px;border-radius:4px;background:linear-gradient(90deg,#f04bdf,#a55dff,#28c5ff);box-shadow:0 0 18px rgba(165,93,255,.65);
}
.access{
  position:relative;isolation:isolate;
  display:inline-flex;align-items:center;justify-content:center;gap:17px;
  min-width:218px;min-height:58px;padding:0 30px;
  border:1px solid transparent;border-radius:999px;
  color:#fff;text-decoration:none;text-transform:uppercase;
  font-size:.78rem;font-weight:800;letter-spacing:.16em;
  background:linear-gradient(110deg,rgba(10,13,35,.92),rgba(13,20,48,.91)) padding-box,
             linear-gradient(105deg,#f04bdf 0%,#a55dff 40%,#28c5ff 100%) border-box;
  box-shadow:0 0 18px rgba(221,54,229,.33),0 0 38px rgba(28,135,255,.22),0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .25s ease,box-shadow .25s ease,filter .25s ease;
}
.access:before{
  content:"";position:absolute;inset:2px;border-radius:inherit;z-index:-1;
  background:linear-gradient(100deg,rgba(255,255,255,.10),rgba(255,255,255,.015) 50%,rgba(255,255,255,.08));
}
.access span{font-size:1.25rem;line-height:1;color:#71dfff;transition:transform .25s ease}
.access:hover{transform:translateY(-5px) scale(1.025);filter:brightness(1.15);box-shadow:0 0 24px rgba(221,54,229,.5),0 0 48px rgba(28,135,255,.36),0 18px 42px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28)}
.access:hover span{transform:translate(3px,-3px)}
.access:focus-visible{outline:3px solid #fff;outline-offset:5px}
@media(max-width:900px){
 .landing{background-size:cover,62% 78%,62% 78%,contain;background-position:center,left center,right center,center center}
}
@media(max-width:600px){
 .landing{min-height:100svh;padding:24px 16px 30px;background-size:cover,72% 70%,72% 70%,auto 72%;background-position:center,left center,right center,center 22%;}
 .landing-content{margin:0 auto 0;padding:24px 16px 20px;border-radius:20px;gap:11px;}
 .landing-name{font-size:clamp(2.5rem,12vw,4rem)}
 .landing-role{font-size:.78rem;letter-spacing:.12em}
 .access{min-width:205px;min-height:54px}
}
@media(prefers-reduced-motion:reduce){.access,.access span{transition:none}}
</style>
</head>
<body>
<main class="landing" aria-label="Portfolio landing page">
  <section class="landing-content" aria-label="Introduction">
    <span class="landing-kicker">Visual Storytelling · Media Production</span>
    <h1 class="landing-name">Murali M</h1>
    <p class="landing-role">DOP &amp; Video Editor</p>
    <a class="access" href="profile.html">Explore Profile <span aria-hidden="true">↗</span></a>
  </section>
</main>
</body>
</html>
