<article id="article" class="reader-article"><p class="eyebrow">THE JOURNAL</p><h1>Loading story…</h1></article>
</main>
<footer class="blog-footer"><a href="blogs.html">← All blogs</a><span>© <span id="year"></span> MURALI M</span></footer>
<script src="assets/js/blog-engagement.js?v=20261112-local-only"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script>
(()=>{
const slug=new URLSearchParams(location.search).get("slug");
const root=document.getElementById("article");document.getElementById("year").textContent=new Date().getFullYear();
const openTranslatedArticle=targetLanguage=>{
  const translateUrl=new URL("https://translate.google.com/translate");
  translateUrl.searchParams.set("sl","auto");
  translateUrl.searchParams.set("tl",targetLanguage);
  translateUrl.searchParams.set("u",window.location.href);
  translateUrl.searchParams.set("op","translate");
  const opened=window.open(translateUrl.toString(),"_blank");
  if(opened) opened.opener=null;
  else window.location.assign(translateUrl.toString());
};
document.getElementById("readerTranslateButton").addEventListener("click",()=>{
  const target=document.getElementById("readerTranslateLanguage").value||"en";
  openTranslatedArticle(target);
});
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=html=>{
const d=new DOMParser().parseFromString("<div>"+(html||"")+"</div>","text/html"),r=d.body.firstElementChild;
const ok=new Set(["P","BR","STRONG","B","EM","I","U","S","H2","H3","H4","UL","OL","LI","BLOCKQUOTE","A","IMG","DIV","FIGURE","FIGCAPTION","HR","CODE","PRE"]);
const w=n=>[...n.childNodes].forEach(c=>{if(c.nodeType!==1){if(c.nodeType!==3)c.remove();return;}if(!ok.has(c.tagName)){const f=d.createDocumentFragment();while(c.firstChild)f.appendChild(c.firstChild);c.replaceWith(f);return;}[...c.attributes].forEach(a=>{const v=a.value;if(c.tagName==="A"&&a.name==="href"&&/^(https?:|mailto:)/i.test(v)){c.target="_blank";c.rel="noopener noreferrer";}else if(c.tagName==="IMG"&&a.name==="src"&&(v.startsWith("assets/blogs/")||v.startsWith("/PORTFOLIO/assets/blogs/")||v.startsWith("https://"))||c.tagName==="IMG"&&a.name==="alt"){}else if(c.tagName==="DIV"&&a.name==="class"&&v==="blog-image-gallery"){}else c.removeAttribute(a.name);});w(c);});
w(r);return r.innerHTML;};
fetch("blogs.json?v="+Date.now()).then(r=>r.ok?r.json():[]).then(data=>{
const posts=Array.isArray(data)?data:(Array.isArray(data?.posts)?data.posts:[]);
const post=posts.find(p=>p.slug===slug);
if(!post){root.innerHTML='<p class="eyebrow">THE JOURNAL</p><h1>Story not found.</h1><p>This post may have moved or is not published yet.</p><a class="read-link" href="blogs.html">Return to the journal ↗</a>';return;}
document.title=post.title+" | Murali M";
root.innerHTML='<p class="eyebrow">'+esc(post.category||"JOURNAL")+' · '+esc(post.date||"")+'</p><h1>'+esc(post.title)+'</h1><p class="reader-excerpt">'+esc(post.excerpt||"")+'</p><div class="reader-byline">BY MURALI M · '+(post.readTime||1)+' MIN READ</div>'+(post.cover?'<img class="reader-cover" src="'+esc(post.cover)+'" alt="">':'')+'<div class="article-body">'+safe(window.marked?window.marked.parse(post.content||""):post.content||"")+'</div><div class="reader-end"><span>END OF STORY</span><a href="blogs.html">More writing ↗</a></div><section class="reader-community" aria-label="Article engagement"><div class="reader-engagement-bar"><button id="readerLikeButton" class="engagement-like" type="button" disabled aria-pressed="false"><span aria-hidden="true">♡</span> Like <b id="readerLikeCount">—</b></button><button id="readerShareButton" class="engagement-share" type="button">Share ↗</button><span class="reader-view-count"><span aria-hidden="true">◉</span> <b id="readerViewCount">—</b> unique views on this device</span></div><p id="engagementStatus" class="engagement-status" aria-live="polite">Connecting engagement features…</p></section><section class="reader-comments" aria-labelledby="commentsHeading"><div class="comments-heading"><div><p class="eyebrow">READER CONVERSATION</p><h2 id="commentsHeading">Leave a thought<span>.</span></h2></div><span id="commentCount" class="comment-count">— comments</span></div><form id="commentForm" class="comment-form"><div class="comment-fields"><label>Name<input id="commentName" name="name" type="text" maxlength="60" required autocomplete="name" placeholder="Your name"></label><label>Your comment<textarea id="commentBody" name="body" rows="4" maxlength="2000" required placeholder="Share your thoughts on this story…"></textarea></label></div><div class="comment-form-footer"><p id="commentFormStatus" aria-live="polite">Comments are saved only in this browser and are not visible to other visitors.</p><button class="comment-submit" type="submit">Post comment ↗</button></div></form><div id="commentsList" class="comments-list" aria-live="polite"><p class="comments-loading">Loading comments…</p></div></section>'; 
    if(window.MuraliBlogEngagement) window.MuraliBlogEngagement.mountReader(post.slug,post.title);
}).catch(()=>{root.innerHTML='<h1>Could not load this story.</h1><a href="blogs.html">Back to blogs</a>';});
})();
</script>

</style>
